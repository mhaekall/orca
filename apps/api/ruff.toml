line-length = 100
target-version = "py310"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pyflakes
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults (common in FastAPI)
]

[format]
quote-style = "double"
indent-style = "space"

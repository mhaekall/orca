name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "master" ]
    paths:
      - 'apps/web/**'
  workflow_dispatch: # Memungkinkan build manual dari GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Android Debug Keystore
        id: cache-keystore
        uses: actions/cache@v3
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-android-debug-keystore

      - name: Generate and Print Keystore SHA-1
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating new debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi
          echo "=========================================="
          echo "GOOGLE CLOUD CONSOLE SHA-1 FINGERPRINT:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "=========================================="

      - name: Cache pnpm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./apps/web
        run: |
          pnpm config set ignore-scripts false
          pnpm install --frozen-lockfile

      - name: Build Next.js (Static Export)
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: https://orcanime.pages.dev
        run: pnpm run cap:build

      - name: Ensure Output Directory Exists
        working-directory: ./apps/web
        run: mkdir -p out && touch out/index.html

      - name: Generate Capacitor Assets
        working-directory: ./apps/web
        run: |
          node scripts/generate-assets.js
          npx -y @capacitor/assets generate --android

      - name: Capacitor Sync
        working-directory: ./apps/web
        run: npx cap sync android

      - name: Build APK (Assemble Debug)
        working-directory: ./apps/web/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "master" ]
    paths:
      - 'apps/web/**'
  workflow_dispatch: # Memungkinkan build manual dari GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache pnpm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./apps/web
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (Static Export)
        working-directory: ./apps/web
        run: pnpm run cap:build

      - name: Capacitor Sync
        working-directory: ./apps/web
        run: npx cap sync android

      - name: Build APK (Assemble Debug)
        working-directory: ./apps/web/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

name: Build Expo Android APK (No EAS)

on:
  workflow_dispatch: # Memungkinkan build manual dari tab Actions di GitHub

jobs:
  build-expo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd apps/mobile && npm install --legacy-peer-deps

      - name: Prebuild Android (Generate Native Code)
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Inject Custom Debug Keystore
        run: |
          cp apps/mobile/expo.keystore apps/mobile/android/app/debug.keystore
          sed -i "s/storePassword 'android'/storePassword '037ac57a7a0879745c1c2d570937d8be'/g" apps/mobile/android/app/build.gradle
          sed -i "s/keyAlias 'androiddebugkey'/keyAlias '54febac3583337c2100b449c8b6e20ef'/g" apps/mobile/android/app/build.gradle
          sed -i "s/keyPassword 'android'/keyPassword '16a19c0f2d377ca520cbb927360bc0bf'/g" apps/mobile/android/app/build.gradle

      - name: Build APK (Assemble Debug)
        working-directory: ./apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-app-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
